apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo
  namespace: todo
spec:
  replicas: 2
  selector:
    matchLabels: { app: todo }
  template:
    metadata:
      labels: { app: todo }
    spec:
      serviceAccountName: todo-app # bound to cluster-admin by Terraform (intentional)
      containers:
        - name: todo
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 8080
          env:
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef: { name: mongo-credentials, key: MONGODB_URI }
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef: { name: mongo-credentials, key: SECRET_KEY }
---
apiVersion: v1
kind: Service
metadata:
  name: todo
  namespace: todo
spec:
  type: ClusterIP
  selector: { app: todo }
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: todo
  namespace: todo
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: todo
                port: { number: 80 }
