name: 1-infra
# Pipeline 1: deploy the exercise as IaC, scan before apply

on:
  pull_request:
    paths: ["infra/**"]
  push:
    branches: [main]
    paths: ["infra/**"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  security-events: write

env:
  TF_VAR_github_repo: ${{ github.repository }}
  TF_VAR_your_name: ${{ vars.YOUR_NAME }}
  TF_VAR_admin_principal_arns: ${{ vars.ADMIN_PRINCIPAL_ARNS || '[]' }}
  TF_VAR_ssh_key_name: ${{ vars.SSH_KEY_NAME }}

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkov IaC scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra
          framework: terraform
          output_format: cli,sarif
          output_file_path: console,results.sarif
          # Exercise infra is weak ON PURPOSE, so findings are reported not blocking.
          # Flip to false (and add skip_check for accepted risks) to make it a hard gate.
          soft_fail: true
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: results.sarif

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - uses: hashicorp/setup-terraform@v3
      - name: Init
        working-directory: infra
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=wiz-exercise/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION || 'us-east-1' }}" \
            -backend-config="use_lockfile=true"
      - name: Validate
        working-directory: infra
        run: |
          terraform fmt -check -recursive || echo "::warning::run terraform fmt -recursive before committing"
          terraform validate
      - name: Plan
        working-directory: infra
        run: terraform plan -out=tfplan
      - name: Apply
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        working-directory: infra
        run: terraform apply -auto-approve tfplan
